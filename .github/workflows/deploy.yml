name: Deploy to Webempresa

on:
  push:
    branches: [main]

jobs:
  ftp-deploy:
    name: Subir por FTP a Webempresa
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Subir archivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Ajusta esta ruta si tu carpeta pública en Webempresa no es public_html
          # (por ejemplo, para un dominio adicional puede ser public_html/tudominio.com)
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
